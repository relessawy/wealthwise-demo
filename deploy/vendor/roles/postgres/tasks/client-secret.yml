- name: Read source credential
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ workload_namespace }}'
    name: '{{ postgres_name }}-{{ suffix }}'
  register: source_secret
  no_log: true
- name: Read existing acceptance credential
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ client_namespace }}'
    name: '{{ postgres_name }}-{{ suffix }}'
  register: target_secret
  no_log: true
- name: Refuse foreign or divergent acceptance credentials
  ansible.builtin.assert:
    that:
    - target_secret.resources | length == 0 or (target_secret.resources[0].metadata.labels.get('demo-library.io/owner','')
      == owner and target_secret.resources[0].data == source_secret.resources[0].data)
  no_log: true
- name: Copy credential for acceptance only
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ postgres_name }}-{{ suffix }}'
        namespace: '{{ client_namespace }}'
        labels:
          demo-library.io/owner: '{{ owner }}'
      data: '{{ source_secret.resources[0].data }}'
  no_log: true
