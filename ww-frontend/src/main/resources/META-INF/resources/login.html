<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · WealthWise</title><style>body{font:17px system-ui;background:#eef3f5;color:#142f3d;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;padding:40px;border-radius:16px;width:min(360px,80vw)}label,input,button{display:block;width:100%;box-sizing:border-box}input{padding:12px;margin:8px 0 20px;font:inherit;border:1px solid #80939d;border-radius:6px}button{background:#153e53;color:white;padding:12px;border:0;border-radius:6px;font:inherit}small{color:#53636a}</style></head><body><main><small>ACME BANK · DEMONSTRATION</small><h1>WealthWise</h1><p>Sign in to explore illustrative financial guidance and your saved history.</p><form id="login"><label for="username">Username</label><input id="username" name="j_username" autocomplete="username" required><label for="password">Password</label><input id="password" name="j_password" type="password" autocomplete="current-password" required><button>Sign in</button></form><p id="error" role="alert"></p><small>This qualification account is separate from Developer Hub. Live AI is not enabled.</small></main><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;document.querySelector('#error').textContent='';try{const r=await fetch('/j_security_check',{method:'POST',body:new URLSearchParams(new FormData(e.target))});if(r.ok){document.querySelector('#password').value='';location.assign('/');}else{document.querySelector('#error').textContent='Sign-in failed. Check your credentials.';}}catch(e){document.querySelector('#error').textContent='Unable to reach the application. Try again.';}finally{button.disabled=false;}});</script></body></html>
