quarkus.http.host=0.0.0.0
quarkus.smallrye-openapi.info-title=WealthWise API
quarkus.swagger-ui.always-include=true
quarkus.http.limits.max-body-size=16K
quarkus.devservices.enabled=false
quarkus.oidc.auth-server-url=${OIDC_ISSUER}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=hybrid
quarkus.oidc.authentication.redirect-path=/oidc/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.audience=${OIDC_CLIENT_ID}
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.http.auth.permission.api.paths=/api/*,/oidc/callback,/logout
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=https://identity.invalid/realms/test
%test.quarkus.oidc.client-id=test
%test.quarkus.oidc.credentials.secret=not-a-live-secret
%test.quarkus.oidc.token.audience=test
