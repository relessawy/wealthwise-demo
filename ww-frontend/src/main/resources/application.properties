quarkus.http.host=0.0.0.0
quarkus.smallrye-openapi.info-title=WealthWise ww-frontend
quarkus.swagger-ui.always-include=true
quarkus.http.limits.max-body-size=16K
quarkus.devservices.enabled=false
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.demo=${DEMO_PASSWORD}
quarkus.security.users.embedded.roles.demo=demo
quarkus.http.auth.basic=true
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=1H
quarkus.http.auth.session.encryption-key=${DEMO_PASSWORD}
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
